name: Build Windows EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "릴리즈 버전 (예: v1.0.0). 비우면 태그 없이 artifact만 업로드"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-desktop.txt

      - name: Build EXE
        run: pyinstaller --noconfirm CSVColumnCompare.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CSVColumnCompare-windows
          path: dist/CSVColumnCompare.exe
          if-no-files-found: error

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ inputs.version }}" ]]; then
            echo "name=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: steps.tag.outputs.name != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: CSV Column Compare ${{ steps.tag.outputs.name }}
          body: |
            ## Windows 실행 파일
            - `CSVColumnCompare.exe` 다운로드 후 실행하세요.
            - Python 설치 없이 바로 사용할 수 있습니다.
          files: dist/CSVColumnCompare.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
